# The remaining LayoutNG core source tree has reciprocal translated C++
# dependencies and compiles through layoutng_assembly.
exclude = ["vendor/smithay-clipboard", "crates/layoutng/layoutng", "vendor/softbuffer", "vendor/winit", "vendor/crabby-avif", "vendor/rav1d", "vendor/hyper-util"]
resolver = "2"

[profile.release]
# Chromium's release build optimizes across component boundaries.  Keep the
# Rust engine crates as architectural boundaries while allowing equivalent
# cross-crate optimization in the shipped binary.
lto = "fat"
codegen-units = 1

# Fast, representative browser builds for headless correctness iteration.
# This is deliberately not a release or performance-measurement artifact.
[profile.iteration]
inherits = "release"
opt-level = 2
lto = "off"
codegen-units = 256
incremental = true
debug = 0
strip = "debuginfo"

# Native experiential checks run the workspace's dev artifact. The software
# renderer and its Skia playback loops are real-time pixel paths: leaving these
# three packages at opt-level 0 turns a DPR 2 scroll frame into tens of
# milliseconds and hides the compositor's actual scheduling behavior.
[profile.dev.package.skia]
opt-level = 3

[profile.dev.package.renderer]
opt-level = 3

[profile.dev.package.renderer_skia]
opt-level = 3

[patch.crates-io]
rav1d = { path = "vendor/rav1d" }
icu_locale_data = { path = "vendor/icu_locale_data-2.3.0" }
zune-jpeg = { path = "vendor/zune-jpeg" }
ttf-parser = { path = "vendor/ttf-parser" }
softbuffer = { path = "vendor/softbuffer" }
winit = { path = "vendor/winit" }

hyper-util = { path = "vendor/hyper-util" }
sfv = { path = "../src/third_party/rust/chromium_crates_io/vendor/sfv-v0_15" }
ref-cast = { path = "../src/third_party/rust/chromium_crates_io/vendor/ref-cast-v1" }
ref-cast-impl = { path = "../src/third_party/rust/chromium_crates_io/vendor/ref-cast-impl-v1" }
