[workspace]
members = [
    "crates/executor",
    "crates/tracing",
    "crates/event_loop",
    "crates/devtools",
    "crates/skia",
    "crates/raster_commands",
    "crates/quickjs",
    "crates/quickjs_tools",
    "crates/layoutng/layoutng_foundation",
    "crates/layoutng/layoutng_foundation/base",
    "crates/font_engine",
    "crates/layoutng/layoutng_geometry",
    "crates/layoutng/layoutng_style",
    "crates/layoutng/layoutng_assembly",
    "crates/layoutng/layoutng_inline_assembly",
    "crates/layoutng/layoutng_block",
    "crates/layoutng/layoutng_multicol",
    "crates/layoutng/layoutng_flex",
    "crates/layoutng/layoutng_grid",
    "crates/layoutng/layoutng_table",
    "crates/layoutng/layoutng_float",
    "crates/layoutng/layoutng_forms",
    "crates/layoutng/layoutng_replaced",
    "crates/layoutng/layoutng_mathml",
    "crates/layoutng/layoutng_svg",
    "crates/icu_bidi",
    "crates/layoutng/layoutng_inline",
    "crates/layoutng/layoutng_list",
    "crates/layoutng/layoutng_out_of_flow",
    "crates/cssom",
    "crates/style",
    "crates/layoutng/layoutng_custom",
    "crates/paint",
    "crates/raster",
    "crates/compositor",
    "crates/viz",
    "crates/renderer",
    "crates/renderer_skia",
    "crates/dom",
    "crates/html",
    "crates/css_parser",
    "crates/http_transport",
    "crates/xhr_transport",
    "crates/url_loader",
    "crates/decode",
    "crates/resource",
    "crates/document",
    "crates/open",
    "crates/document_loader",
    "crates/image_decoder",
    "crates/image_resource",
    "crates/document_image",
    "crates/web_font",
    "crates/javascript",
    "crates/webapi",
    "crates/interaction",
    "crates/animation",
    "crates/page_mutation",
    "crates/browser",
    "apps/rechrom",
]
# These source trees have reciprocal C++ dependencies and compile through
# layoutng_assembly. They remain source modules rather than standalone builds.
exclude = ["crates/layoutng/layoutng", "crates/layoutng/layoutng_fragment_tree", "vendor/softbuffer", "vendor/winit", "vendor/crabby-avif", "vendor/rav1d"]
resolver = "2"

[patch.crates-io]
rav1d = { path = "vendor/rav1d" }
icu_locale_data = { path = "vendor/icu_locale_data-2.3.0" }
zune-jpeg = { path = "vendor/zune-jpeg" }
ttf-parser = { path = "vendor/ttf-parser" }
softbuffer = { path = "vendor/softbuffer" }
winit = { path = "vendor/winit" }
