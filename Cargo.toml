[workspace]
members = [
    "crates/executor",
    "crates/tracing",
    "crates/event_loop",
    "crates/devtools",
    "crates/skia",
    "crates/raster_commands",
    "crates/quickjs",
    "crates/quickjs_tools",
    "crates/layoutng/layoutng_foundation",
    "crates/layoutng/layoutng_foundation/base",
    "crates/font_engine",
    "crates/layoutng/layoutng_geometry",
    "crates/layoutng/layoutng_style",
    "crates/layoutng/layout_invalidation",
    "crates/layoutng/layout_reuse",
    "crates/layoutng/layout_fragment",
    "crates/layoutng/layout_commit",
    "crates/layoutng/layoutng_assembly",
    "crates/layoutng/layout_algo_inline_assembly",
    "crates/layoutng/layout_algo_block",
    "crates/layoutng/layout_algo_fragmentation",
    "crates/layoutng/layout_algo_multicol",
    "crates/layoutng/layout_algo_flex",
    "crates/layoutng/layout_algo_grid",
    "crates/layoutng/layout_algo_table",
    "crates/layoutng/layout_algo_float",
    "crates/layoutng/layout_algo_forms",
    "crates/layoutng/layout_algo_replaced",
    "crates/layoutng/layout_algo_sizing",
    "crates/layoutng/layout_algo_mathml",
    "crates/layoutng/layout_algo_svg",
    "crates/icu_bidi",
    "crates/layoutng/layout_algo_inline",
    "crates/layoutng/layout_algo_list",
    "crates/layoutng/layout_algo_out_of_flow",
    "crates/cssom",
    "crates/style/style_model",
    "crates/style/style_parser",
    "crates/style/style_rules",
    "crates/style/style_invalidation",
    "crates/style/style_walk",
    "crates/style/style_match",
    "crates/style/style_resolve",
    "crates/style/style_diff",
    "crates/style/style_commit",
    "crates/style/style",
    "crates/layoutng/layout_algo_custom",
    "crates/paint/paint_model",
    "crates/paint/paint_walk",
    "crates/paint/paint_reuse",
    "crates/paint/paint_record",
    "crates/paint/paint_chunk",
    "crates/paint/prepaint",
    "crates/paint/paint_commit",
    "crates/paint",
    "crates/raster",
    "crates/compositor/compositor_layerize",
    "crates/compositor/compositor_tree",
    "crates/compositor/compositor_tile",
    "crates/compositor/compositor_raster",
    "crates/compositor/compositor_draw",
    "crates/compositor/compositor_frame",
    "crates/compositor/compositor_resource",
    "crates/compositor/compositor_scheduler",
    "crates/compositor/compositor_input",
    "crates/compositor/compositor_animation",
    "crates/compositor",
    "crates/viz",
    "crates/renderer",
    "crates/renderer_skia",
    "crates/dom",
    "crates/html",
    "crates/css_parser",
    "crates/http_transport",
    "crates/xhr_transport",
    "crates/url_loader",
    "crates/decode",
    "crates/resource",
    "crates/document",
    "crates/open",
    "crates/document_loader",
    "crates/image_decoder",
    "crates/image_resource",
    "crates/document_image",
    "crates/web_font",
    "crates/javascript",
    "crates/webapi",
    "crates/interaction",
    "crates/animation",
    "crates/page_mutation",
    "crates/browser",
    "apps/rechrom",
]
# The remaining LayoutNG core source tree has reciprocal translated C++
# dependencies and compiles through layoutng_assembly.
exclude = ["crates/layoutng/layoutng", "vendor/softbuffer", "vendor/winit", "vendor/crabby-avif", "vendor/rav1d"]
resolver = "2"

[profile.release]
# Chromium's release build optimizes across component boundaries.  Keep the
# Rust engine crates as architectural boundaries while allowing equivalent
# cross-crate optimization in the shipped binary.
lto = "fat"
codegen-units = 1

[patch.crates-io]
rav1d = { path = "vendor/rav1d" }
icu_locale_data = { path = "vendor/icu_locale_data-2.3.0" }
zune-jpeg = { path = "vendor/zune-jpeg" }
ttf-parser = { path = "vendor/ttf-parser" }
softbuffer = { path = "vendor/softbuffer" }
winit = { path = "vendor/winit" }
