[package]
name = "rechrom_app"
version = "0.0.1"
edition = "2021"
publish = false

[[bin]]
name = "rechrom"
path = "src/main.rs"

[build-dependencies]
cc = "1"

[features]
default = []
allocation_diagnostics = ["browser_tracing/allocation_diagnostics"]
# ChromeOS uses Rust's Linux target and Chromium's distinct editing behavior.
chromeos = []
webgl_vertical_slice = ["browser/webgl_vertical_slice"]

[dev-dependencies]
foundation = { package = "layoutng_foundation", path = "../../crates/layoutng/layoutng_foundation" }

[dependencies]
icu_bidi = { path = "../../crates/icu_bidi" }
fileapi = { path = "../../crates/fileapi" }
bytemuck = "1.24"
executor = { path = "../../crates/executor" }
browser_tracing = { path = "../../crates/tracing" }
event_loop = { path = "../../crates/event_loop" }
devtools = { path = "../../crates/devtools" }
foundation = { package = "layoutng_foundation", path = "../../crates/layoutng/layoutng_foundation" }
paint = { path = "../../crates/paint" }
browser = { path = "../../crates/browser" }
net_filename = { path = "../../crates/net_filename" }
navigation_history = { path = "../../crates/navigation_history" }
compositor = { path = "../../crates/compositor" }
renderer_skia = { path = "../../crates/renderer_skia" }
renderer = { path = "../../crates/renderer" }
viz = { path = "../../crates/viz" }
interaction = { path = "../../crates/interaction" }
page_mutation = { path = "../../crates/page_mutation" }
dom = { path = "../../crates/dom" }
image_decoder = { path = "../../crates/image_decoder" }
document_image = { path = "../../crates/document_image" }
image_resource = { path = "../../crates/image_resource" }
url_loader = { path = "../../crates/url_loader" }
xhr_transport = { path = "../../crates/xhr_transport" }
javascript = { path = "../../crates/javascript" }
layoutng_assembly = { path = "../../crates/layoutng/layoutng_assembly" }
url = "2.5"
serde_json = "1"
png = "0.18"
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }
softbuffer = { version = "0.4.8", features = ["native-iosurface"] }
raw-window-handle = "0.6.2"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
# Pinned upstream v0.7.2; provenance and MIT license are retained in vendor.
smithay-clipboard = { path = "../../vendor/smithay-clipboard" }
x11rb = { version = "0.13", features = ["shape"] }
x11-dl = "2.21"
wayland-client = "0.31.15"
wayland-backend = { version = "0.3.17", default-features = false, features = ["client_system", "dlopen"] }
