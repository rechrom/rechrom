[package]
name = "http_transport"
version = "0.0.1"
edition = "2021"

[dependencies]
base64 = "0.22"
bytes = "1"
brotli = "8"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
http-body-util = "0.1"
hyper = { version = "1.11", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1.21", features = ["client", "client-legacy", "client-proxy", "http1", "http2", "tokio"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "tls12"] }
percent-encoding = "2"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "custom-provider"] }
# Explicit RustCrypto provider: neither ring nor aws-lc is linked by this transport.
rustls-rustcrypto = "=0.0.2-alpha"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12"] }
tower-service = "0.3"
url = "2.5.8"
webpki-roots = "1"

[dev-dependencies]
h2 = "0.4.19"
