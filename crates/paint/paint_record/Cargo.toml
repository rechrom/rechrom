[package]
name = "paint_record"
version = "0.0.1"
edition = "2021"

[dependencies]
browser_tracing = { path = "../../tracing" }
canvas = { path = "../../canvas" }
font_engine = { path = "../../font_engine" }
foundation = { package = "layoutng_foundation", path = "../../layoutng/layoutng_foundation" }
image_resource = { path = "../../image_resource" }
layoutng_assembly = { path = "../../layoutng/layoutng_assembly" }
layoutng_style = { path = "../../layoutng/layoutng_style" }
paint_chunk = { path = "../paint_chunk" }
paint_model = { path = "../paint_model" }
paint_reuse = { path = "../paint_reuse" }
prepaint = { path = "../prepaint" }
serde_json = "1"

[dev-dependencies]
# Tests exercise the same assembled Layout providers used by Browser. The
# production dependency remains feature-minimal; Cargo unifies this only for
# the paint_record test target so the extern virtual-dispatch providers link.
layoutng_assembly = { path = "../../layoutng/layoutng_assembly", features = ["translation_in_progress"] }
