[package]
name = "compositor"
version = "0.0.1"
edition = "2021"
publish = false

[features]
default = []
chromeos = []

[dependencies]
scroll_animation = { path = "scroll_animation" }
canvas = { path = "../canvas" }
browser_tracing = { path = "../tracing" }
compositor_layerize = { path = "compositor_layerize" }
compositor_tree = { path = "compositor_tree" }
compositor_tile = { path = "compositor_tile" }
compositor_raster = { path = "compositor_raster" }
compositor_draw = { path = "compositor_draw" }
compositor_frame = { path = "compositor_frame" }
compositor_resource = { path = "compositor_resource" }
compositor_scheduler = { path = "compositor_scheduler" }
compositor_input = { path = "compositor_input" }
compositor_animation = { path = "compositor_animation" }
paint = { path = "../paint" }
paint_model = { path = "../paint/paint_model" }
paint_skia = { path = "../paint/paint_skia" }
foundation = { package = "layoutng_foundation", path = "../layoutng/layoutng_foundation" }
skia = { path = "../skia" }
image_decoder = { path = "../image_decoder", default-features = false }
serde_json = "1"
getrandom = "0.4"

[dev-dependencies]
layoutng_assembly = { path = "../layoutng/layoutng_assembly" }
