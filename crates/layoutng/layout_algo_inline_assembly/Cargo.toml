[package]
name = "layout_algo_inline_assembly"
version = "0.0.1"
edition = "2021"

[dependencies]
browser_tracing = { path = "../../tracing" }
foundation = { package = "layoutng_foundation", path = "../layoutng_foundation" }
font_engine = { path = "../../font_engine" }
layoutng_geometry = { path = "../layoutng_geometry" }
layoutng_style = { path = "../layoutng_style" }
layout_invalidation = { path = "../layout_invalidation" }
layout_reuse = { path = "../layout_reuse" }
# Included sources already resolve `layout_fragment` to this assembly crate.
# This key reaches the standalone opaque-result ownership boundary.
layout_fragment_boundary = { package = "layout_fragment", path = "../layout_fragment" }
layout_commit = { path = "../layout_commit" }
layout_algo_mathml = { path = "../layout_algo_mathml" }
icu_bidi = { path = "../../icu_bidi" }
cssom = { path = "../../cssom" }
layout_algo_custom = { path = "../layout_algo_custom" }
image_resource = { path = "../../image_resource" }
skia = { path = "../../skia" }

[features]
default = []
translation_in_progress = []
expensive_dchecks = []

[lib]
path = "src/lib.rs"
