[package]
name = "paint_input_types"
version = "0.0.1"
edition = "2021"

# Plain retained paint values shared by Layout (producer), Paint, Raster,
# Compositor and Style. Only lower value crates may be named here: never
# layoutng, layoutng_assembly or a layout_* package.
[dependencies]
canvas = { path = "../../canvas" }
foundation = { path = "../../foundation" }
font_engine = { path = "../../font_engine" }
image_resource = { path = "../../image_resource" }
layoutng_style = { path = "../layoutng_style" }

[lib]
path = "src/lib.rs"
