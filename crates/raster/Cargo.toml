[package]
name = "raster"
version = "0.0.1"
edition = "2021"

[dependencies]
compositor_core = { package = "compositor", path = "../compositor" }
foundation = { package = "layoutng_foundation", path = "../foundation" }
image_resource = { path = "../image_resource" }
layoutng_assembly = { path = "../layoutng_assembly" }
paint = { path = "../paint", features = ["translation_in_progress"] }
raster_commands = { path = "../raster_commands" }
skia = { path = "../skia" }

[features]
default = []

[dev-dependencies]
font_engine = { path = "../font_engine" }
