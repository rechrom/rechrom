[package]
name = "raster"
version = "0.0.1"
edition = "2021"
build = "build.rs"

[dependencies]
compositor_core = { package = "compositor", path = "../compositor" }
foundation = { package = "layoutng_foundation", path = "../foundation" }
image_resource = { path = "../image_resource" }
layoutng_assembly = { path = "../layoutng_assembly" }
paint = { path = "../paint", features = ["translation_in_progress"] }
skia = { path = "../skia" }
font_engine = { path = "../font_engine", optional = true }

[features]
default = []
# macOS-only C++ reference oracle. Production uses pure_replay.
text = []
font_backend = ["dep:font_engine"]
source_replay = ["font_backend"]
pure_replay = []
profiling = ["pure_replay", "skia/profiling"]

[dev-dependencies]
font_engine = { path = "../font_engine" }
