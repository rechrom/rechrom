[package]
name = "dom"
version = "0.0.1"
edition = "2021"

[dependencies]
navigation_history = { path = "../navigation_history" }
intersection_observer = { path = "../intersection_observer" }
resize_observer = { path = "../resize_observer" }
getrandom = "0.4"
base64 = "0.22"
sha2 = "0.10"
# Chromium net/http structured-header parser wrapper uses this exact RFC parser.
sfv = "=0.15.0"
fileapi = { path = "../fileapi" }
canvas = { path = "../canvas" }
browser_tracing = { path = "../tracing" }
cssom = { path = "../cssom" }
layoutng_assembly = { path = "../layoutng/layoutng_assembly" }

css_parser = { path = "../css_parser", features = ["tokenizer"] }
font_engine = { path = "../font_engine" }
foundation = { package = "layoutng_foundation", path = "../layoutng/layoutng_foundation" }
image_resource = { path = "../image_resource" }
layoutng_style = { path = "../layoutng/layoutng_style" }
style_parser = { path = "../style/style_parser" }
url = "2"

[dev-dependencies]
html = { path = "../html" }
style = { path = "../style/style" }
# Standalone DOM tests link the assembly dispatch's real replaced-object
# provider; browser executables already supply it through their layout bundle.
layout_algo_replaced = { path = "../layoutng/layout_algo_replaced" }
layout_algo_block = { path = "../layoutng/layout_algo_block", features = ["block_only_host", "replaced_extension"] }

layoutng_assembly = { path = "../layoutng/layoutng_assembly", features = ["translation_in_progress"] }
