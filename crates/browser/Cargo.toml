[package]
name = "browser"
version = "0.0.1"
edition = "2021"

[dependencies]
executor = { path = "../executor" }
animation = { path = "../animation" }
style = { path = "../style/style" }
browser_tracing = { path = "../tracing" }
url = "2"
document_loader = { path = "../document_loader" }
document = { path = "../document" }
open = { path = "../open" }
resource = { path = "../resource" }
decode = { path = "../decode" }
interaction = { path = "../interaction" }
page_mutation = { path = "../page_mutation" }
cssom = { path = "../cssom" }
dom = { path = "../dom" }
html = { path = "../html" }
javascript = { path = "../javascript" }
webapi = { path = "../webapi" }
xhr_transport = { path = "../xhr_transport" }
image_decoder = { path = "../image_decoder" }
document_image = { path = "../document_image" }
image_resource = { path = "../image_resource" }
layoutng_assembly = { path = "../layoutng/layoutng_assembly" }
layout_fragment = { path = "../layoutng/layout_fragment" }
layout_algo_block = { path = "../layoutng/layout_algo_block", features = ["block_only_host", "replaced_extension"] }
layout_algo_multicol = { path = "../layoutng/layout_algo_multicol" }
layout_algo_flex = { path = "../layoutng/layout_algo_flex" }
layout_algo_grid = { path = "../layoutng/layout_algo_grid" }
layout_algo_table = { path = "../layoutng/layout_algo_table" }
layout_algo_float = { path = "../layoutng/layout_algo_float" }
layout_algo_forms = { path = "../layoutng/layout_algo_forms" }
layout_algo_replaced = { path = "../layoutng/layout_algo_replaced" }
layout_algo_svg = { path = "../layoutng/layout_algo_svg" }
layout_algo_list = { path = "../layoutng/layout_algo_list" }
layout_algo_out_of_flow = { path = "../layoutng/layout_algo_out_of_flow", optional = true }
paint = { path = "../paint" }
url_loader = { path = "../url_loader" }
renderer = { path = "../renderer" }
renderer_skia = { path = "../renderer_skia" }
raster = { path = "../raster" }
foundation = { package = "layoutng_foundation", path = "../layoutng/layoutng_foundation" }
web_font = { path = "../web_font" }
font_engine = { path = "../font_engine" }
compositor = { path = "../compositor" }
viz = { path = "../viz" }

[dev-dependencies]
layoutng_style = { path = "../layoutng/layoutng_style" }
raster = { path = "../raster", features = ["artifact_test_support"] }

[features]
default = ["inline_layout"]
inline_layout = ["layoutng_assembly/translation_in_progress", "layout_algo_block/inline_extension", "dep:layout_algo_out_of_flow"]
