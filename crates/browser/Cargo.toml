[package]
name = "browser"
version = "0.0.1"
edition = "2021"

[dependencies]
serde_json = "1"
intersection_observer = { path = "../webapi/intersection_observer" }
navigation_history = { path = "../document/navigation_history" }
scroll_animation = { path = "../compositor/scroll_animation" }
fileapi = { path = "../webapi/fileapi" }
getrandom = "0.4"
canvas = { path = "../canvas" }
icu_bidi = { path = "../icu_bidi" }
url_formatter = { path = "url_formatter" }
resize_observer = { path = "../webapi/resize_observer" }
event_loop = { path = "../event_loop" }
executor = { path = "../executor" }
animation = { path = "../animation" }
style = { path = "../style/style" }
browser_tracing = { path = "../tracing" }
url = "2"
document_loader = { path = "../document_loader" }
document = { path = "../document" }
open = { path = "../open" }
resource = { path = "../resource" }
decode = { path = "../decode" }
interaction = { path = "../interaction" }
page_mutation = { path = "../page_mutation" }
cssom = { path = "../cssom" }
dom = { path = "../dom" }
html = { path = "../document/html" }
javascript = { path = "../javascript" }
webapi = { path = "../webapi" }
xhr_transport = { path = "../xhr_transport" }
image_decoder = { path = "../image_decoder" }
document_image = { path = "../document_image" }
image_resource = { path = "../image_resource" }
layout = { path = "../layout/layout", default-features = false }
layout_style = { path = "../layout/layout_style" }
paint = { path = "../paint" }
paint_skia = { path = "../paint/paint_skia" }
url_loader = { path = "../url_loader" }
renderer = { path = "../renderer" }
renderer_skia = { path = "../renderer_skia" }
raster = { path = "../raster" }
foundation = { path = "../foundation" }
web_font = { path = "../web_font" }
font_engine = { path = "../font_engine" }
compositor = { path = "../compositor" }
layerize = { path = "../layerize" }
viz = { path = "../viz" }

[dev-dependencies]
open = { path = "../open", features = ["test_support"] }
raster = { path = "../raster", features = ["artifact_test_support"] }

[features]
default = ["inline_layout"]
inline_layout = ["layout/inline_layout"]
webgl_vertical_slice = ["webapi/webgl_vertical_slice"]
