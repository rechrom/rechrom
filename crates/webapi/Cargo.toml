[package]
name = "webapi"
version = "0.0.1"
edition = "2021"

[features]
default = []
# A verified real-GPU vertical slice used by focused tests. Production keeps
# WebGL feature detection false until the minimum WebGL1 API is complete.
webgl_vertical_slice = []

[dependencies]
style = { path = "../style/style" }
browser_tracing = { path = "../tracing" }
foundation = { package = "layoutng_foundation", path = "../layoutng/layoutng_foundation" }
interaction = { path = "../interaction" }
navigation_history = { path = "../document/navigation_history" }
fileapi = { path = "fileapi" }
javascript = { path = "../javascript" }
dom = { path = "../dom" }
cssom = { path = "../cssom" }
css_parser = { path = "../css_parser", features = ["tokenizer"] }
layoutng_assembly = { path = "../layoutng/layoutng_assembly" }
xhr_transport = { path = "../xhr_transport" }
url = "2.5.8"
percent-encoding = "2.3.2"
getrandom = "0.4"
paint = { path = "../paint" }
skia = { path = "../skia" }
canvas = { path = "../canvas" }
webgl = { path = "webgl" }

[dev-dependencies]
html = { path = "../document/html" }
http_transport = { path = "../http_transport" }
# Standalone Web API tests link the assembly dispatch's real replaced-object
# provider; browser executables already supply it through their layout bundle.
layout_algo_replaced = { path = "../layoutng/layout_algo_replaced" }
