[package]
name = "layerize"
version = "0.0.1"
edition = "2021"
publish = false

# Main-thread compositor half (Blink PaintArtifactCompositor and the cc
# LayerTreeHost side). It must never depend on the `compositor` facade; the
# impl half depends on `layerize::commit` only. See
# crates/compositor/MAIN_IMPL_SPLIT.md.
[dependencies]
compositor_tree = { path = "../compositor/compositor_tree" }
compositor_input = { path = "../compositor/compositor_input" }
compositor_draw = { path = "../compositor/compositor_draw" }
compositor_animation = { path = "../compositor/compositor_animation" }
compositor_scheduler = { path = "../compositor/compositor_scheduler" }
skia = { path = "../skia" }
# cc::FilterOperations (cc/paint) for the shared filter facets; the main half
# also reads PaintArtifact once PAC moves here.
paint = { path = "../paint" }
foundation = { path = "../foundation" }
