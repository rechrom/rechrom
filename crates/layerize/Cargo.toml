[package]
name = "layerize"
version = "0.0.1"
edition = "2021"
publish = false

# Main-thread compositor half (Blink PaintArtifactCompositor and the cc
# LayerTreeHost side). It must never depend on the `compositor` facade; the
# impl half depends on `layerize::commit` only. See
# crates/compositor/MAIN_IMPL_SPLIT.md.
[dependencies]
compositor_tree = { path = "../compositor/compositor_tree" }
# cc shared values (cc/input, LayerTreeSettings fields, viz, gfx) named by
# both sides.
compositor_values = { path = "../compositor/compositor_values" }
# Only the transform facet impls until S4-4c.
compositor_input = { path = "../compositor/compositor_input" }
compositor_draw = { path = "../compositor/compositor_draw" }
compositor_animation = { path = "../compositor/compositor_animation" }
# The main AnimationHost mutations (ScrollAnimationMutation and its
# completions) the main half applies (commit::main_mutator), and base time.
scroll_animation = { path = "../compositor/scroll_animation" }
skia = { path = "../skia" }
# Blink ContentLayerClient (PictureLayer client) and PAC layerization policy.
compositor_layerize = { path = "compositor_layerize" }
# cc::FilterOperations (cc/paint) for the shared filter facets; the main half
# also reads PaintArtifact once PAC moves here.
paint = { path = "../paint" }
# PaintModel's geometry-mapper matrix facets and Paint's Skia path compiler,
# implemented by the shared Transform / SkRegion value backends.
paint_model = { path = "../paint/paint_model" }
paint_skia = { path = "../paint/paint_skia" }
foundation = { path = "../foundation" }
# canvas::CanvasRecordReadLease, implemented by the canvas child raster input.
canvas = { path = "../canvas" }
browser_tracing = { path = "../tracing" }
serde_json = "1"
# Paint metric sampler seed of the Skia paint platform (runtime/paint/services.rs).
getrandom = "0.4"

[dev-dependencies]
# PaintResources values built by the cc/paint metadata unit tests.
paint_input_types = { path = "../layout/paint_input_types" }
