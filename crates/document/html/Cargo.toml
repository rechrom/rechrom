[package]
name = "html"
version = "0.0.1"
edition = "2021"

[dependencies]
# Same already-vendored parser backend as pinned Blink xml_ffi.rs. The source
# lives in the adjacent Chromium checkout, so offline builds never fetch it.
xml = { path = "../../../vendor/xml" }
dom = { path = "../../dom" }
foundation = { path = "../../foundation" }

# DOM retains layout objects; standalone tests link the Layout facade, which
# carries the replaced-object boundary and the inline implementation used by
# their destructor.
[dev-dependencies]
layout = { path = "../../layout/layout" }
