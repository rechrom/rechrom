[package]
name = "layout_algo_block"
version = "0.0.1"
edition = "2021"

[dependencies]
foundation = { path = "../../foundation" }
font_engine = { path = "../../font_engine" }
layout_base = { path = "../layout_base" }
# block_inline_layout.rs (Chromium layoutng_block/block_inline_layout.cc)
# drives the inline child contexts; only with `inline_extension`.
layout_algo_inline = { path = "../layout_algo_inline", optional = true }
layout_geometry = { path = "../layout_geometry" }
layout_style = { path = "../layout_style" }

[dev-dependencies]
paint = { path = "../../paint" }
raster = { path = "../../raster" }

[features]
default = []
# Matches //src/layoutng_block:inline_extension. The block-only C++ render
# profile links the algorithm target but does not install inline support.
inline_extension = ["dep:layout_algo_inline", "layout_base/translation_in_progress"]
block_only_host = []
# The full browser supplies the replaced-content implementation separately.
replaced_extension = []
# Opt-in executable acceptance test while the host virtual dispatch is linked.
constructed_fixture = ["block_only_host"]

[lib]
path = "src/lib.rs"

# Pending Bazel dependencies: foundation APIs and font_engine. The
# layoutng_inline extension API is the optional `layout_algo_inline` crate.
