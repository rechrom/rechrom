[package]
name = "layout_fragment"
version = "0.0.1"
edition = "2021"

# Fragment data (layer L1 in `crates/layout/PACKAGE_MAP.md`). It depends only
# on the shared roots below and never on base (`layout_core`, compiled inside
# `layout_assembly`); base depends on this crate. A LayoutObject, Node or
# PaintLayer is named only through the opaque handles in `src/opaque.rs`;
# behaviour that needs the concrete object lives in base extension traits.
[dependencies]
scroll_snap = { path = "../../compositor/scroll_snap" }
browser_tracing = { path = "../../tracing" }
canvas = { path = "../../canvas" }
foundation = { path = "../../foundation" }
font_engine = { path = "../../font_engine" }
image_resource = { path = "../../image_resource" }
layout_geometry = { path = "../layout_geometry" }
layout_style = { path = "../layout_style" }
paint_input_types = { path = "../paint_input_types" }

[lib]
path = "src/lib.rs"

# Pending: the fragment-tree types that still dereference LayoutObject
# behaviour (PhysicalFragment, PhysicalBoxFragment, FragmentItem(s),
# InlineCursor, LayoutResult, break tokens, ...) are compiled by
# `layout_assembly` until their base-dependent methods move into base
# extension traits; see PACKAGE_MAP.md §7 (R4 status).
