[package]
name = "layout_core"
version = "0.0.1"
edition = "2021"

[dependencies]
intersection_observer = { path = "../../webapi/intersection_observer" }
resize_observer = { path = "../../webapi/resize_observer" }
scroll_snap = { path = "../../compositor/scroll_snap" }
browser_tracing = { path = "../../tracing" }
canvas = { path = "../../canvas" }
foundation = { path = "../../foundation" }
font_engine = { path = "../../font_engine" }
image_resource = { path = "../../image_resource" }
layout_geometry = { path = "../layout_geometry" }
layout_style = { path = "../layout_style" }
paint_input_types = { path = "../paint_input_types" }
layout_invalidation = { path = "../layout_invalidation" }
layout_reuse = { path = "../layout_reuse" }
layout_commit = { path = "../layout_commit" }
skia = { path = "../../skia" }

[lib]
path = "src/lib.rs"

[features]
expensive_dchecks = []

# Pending Bazel dependencies include layoutng_fragment_tree, foundation APIs,
# font_engine, and icu_bidi. The fragment-tree reference is cyclic at the
# C++ package level. layout_assembly compiles both source module trees in
# one unit without copying their implementations; this crate alone remains
# blocked on the reciprocal declarations.
