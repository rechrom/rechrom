[package]
name = "layout_algo_inline_assembly"
version = "0.0.1"
edition = "2021"

[dependencies]
browser_tracing = { path = "../../tracing" }
foundation = { path = "../../foundation" }
font_engine = { path = "../../font_engine" }
layout_geometry = { path = "../layout_geometry" }
layout_style = { path = "../layout_style" }
paint_input_types = { path = "../paint_input_types" }
# Pure ComputedStyle -> paint-value projection shared with Style.
layout_style_paint = { path = "../../layout/layout_style_paint" }
layout_invalidation = { path = "../layout_invalidation" }
layout_reuse = { path = "../layout_reuse" }
layout_commit = { path = "../layout_commit" }
layout_algo_mathml = { path = "../layout_algo_mathml" }
icu_bidi = { path = "../../icu_bidi" }
cssom = { path = "../../cssom" }
# Sole compile unit of color_parser.rs, re-exported as `css_color_parser`.
css_parser = { path = "../../css_parser", features = ["color_parser"] }
layout_algo_custom = { path = "../layout_algo_custom" }
image_resource = { path = "../../image_resource" }
skia = { path = "../../skia" }

[features]
default = []
translation_in_progress = []
expensive_dchecks = []

[lib]
path = "src/lib.rs"
